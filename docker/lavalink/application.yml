# Lavalink v4 configuration.
#
# Two layers, and this file only configures the second one (see
# docs/MUSIC_SYSTEM.md). Spotify, Apple Music and Deezer identify what song was
# asked for; SoundCloud, YouTube and HTTP supply the audio. SoundCloud is the
# primary playback provider and YouTube the fallback — the bot enforces that
# order itself, and the LavaSrc provider list below mirrors it so the rarely-used
# plugin-side path does not disagree.
#
# YouTube is served by a plugin (Lavalink v4 removed built-in support);
# Spotify and Apple Music by LavaSrc; SoundCloud and HTTP are built in.
#
# Plugins are downloaded on first start into the `lavalink-plugins` volume.

server:
  port: 2333
  address: 0.0.0.0

lavalink:
  # Do not delete this block. Lavalink loads whatever jars are already in the
  # plugins volume, so without these declarations nothing pins or updates them:
  # the volume keeps serving the jars some earlier run happened to download, and
  # the version silently freezes. That is how youtube-source stalled at 1.13.5
  # until every track died with "Must find sig function from script" — YouTube
  # had changed its player script and the pinned extractor could no longer read
  # it. Bump `youtube-plugin` whenever the startup log reports a newer release;
  # YouTube breaks old versions regularly and only the current one is supported.
  plugins:
    # Pinned to a snapshot, not a release, and deliberately.
    #
    # 1.18.2 is the newest tagged release and it could not play anything here:
    # YouTube answered every client with formats carrying no `url` and no
    # `signatureCipher` — its SABR migration, where stream URLs are withheld —
    # and the plugin skips formats it cannot address, reporting the empty
    # "No supported audio streams available, available types:". yt-dlp streamed
    # the same videos from this same host, which is what ruled out an IP ban.
    #
    # Four commits landed after that release and before this one, all aimed at
    # this: a client-version bump to 21.02.35, a PlayStation 4 User-Agent for
    # the TV client, recovery of the total length for formats that omit
    # contentLength, and "make IOS playable".
    #
    # The cost of a commit pin is that nothing tells you when it is stale, so
    # check for a release above 1.18.2 periodically and move back to one.
    - dependency: 'dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3'
      repository: 'https://maven.lavalink.dev/snapshots'
    # 4.8.3 carries the Spotify playlist endpoint move from /tracks to /items,
    # which newly created Spotify apps require — worth having before this app's
    # credentials are ever reissued.
    #
    # Not fixed by the upgrade, and pre-dating it: `spsearch:` and Spotify album
    # lookups answer 403 here on 4.7.3 and 4.8.3 alike. LavaSrc reaches those
    # through Spotify's anonymous tokens rather than the client credentials
    # configured below, and since 4.7.3 those need `spotify.customTokenEndpoint`
    # set to work at all. Direct Spotify *track* URLs are unaffected, and the
    # bot resolves Spotify through its own API client, so this path is a rarely
    # used fallback — but it is broken, not merely unused.
    - dependency: 'com.github.topi314.lavasrc:lavasrc-plugin:4.8.3'
      repository: 'https://maven.lavalink.dev/releases'
  server:
    password: '${LAVALINK_SERVER_PASSWORD:youshallnotpass}'
    sources:
      # Handled by the youtube-source plugin below, not the built-in source.
      youtube: false
      soundcloud: true
      bandcamp: false
      twitch: false
      vimeo: false
      http: true
      local: false
    # All native Lavalink filters are enabled — the /filter command exposes
    # them as presets (bass boost, nightcore, vaporwave, karaoke, 8D, …).
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    # Upstream's recommended four (MUSIC, ANDROID_VR, WEB, WEBEMBEDDED) plus
    # three more playback-capable clients from the youtube-source client table.
    # Clients are tried in order and a video only fails once every one of them
    # has: widening the list is what turns "YouTube refused this client" from a
    # dead track into a retry. Order puts the cheapest first — ANDROID_VR needs
    # no player script at all — so the common case never pays for the fallbacks.
    clients:
      # Do not add IOS here. The snapshot above makes it playable, but its
      # search is broken, and as the first search-capable client in the list it
      # captures every `ytsearch:` and answers "empty" — which silently breaks
      # Spotify resolution, since lavasrc reaches YouTube through ytsearch.
      - MUSIC # ytmsearch only — this client cannot play.
      - ANDROID_VR # Plays most videos without touching the player script.
      - TVHTML5_SIMPLY # Added in 1.18.0; covers videos ANDROID_VR is refused.
      - ANDROID_MUSIC
      - MWEB
      - WEB
      - WEBEMBEDDED
      - TV # Last: the only client that plays sign-in-gated videos, and only
      #      once `oauth` below is switched on. Harmless while it is off — it
      #      is reached solely for tracks every other client already refused.
    # Signature deciphering is delegated to yt-cipher. youtube-source's built-in
    # extractor could not parse YouTube's current player script — that is the
    # literal "Must find sig function from script" failure — and upstream now
    # points at a remote cipher server rather than chasing each player change in
    # the plugin. Without this, WEB and MWEB cannot produce a playable URL.
    remoteCipher:
      url: '${YT_CIPHER_URL:http://yt-cipher:8001}'
      password: '${YT_CIPHER_PASSWORD:}'
    # A separate failure from the cipher one above, and the one that actually
    # breaks playback here: YouTube decides the requesting IP is a bot and
    # answers "This video requires login" / "Sign in to confirm you're not a
    # bot" / 403 on every client at once. The WEB client's version of the same
    # refusal is quieter and easy to misread — "No supported audio streams
    # available, available types:" with an *empty* type list, meaning YouTube
    # returned the video with every format withheld rather than returning an
    # error.
    #
    # A proof-of-origin token is upstream's remedy, and it is not a silver
    # bullet: it applies only to the WEB and WEBEMBEDDED clients, which is why
    # those two stay in the client list above even though they are the slowest.
    # Every other client is refused or accepted on YouTube's mood alone.
    #
    # Mint a pair with `pnpm run pot:refresh`, which also restarts this server —
    # the values below are read once, at startup. Do not reach for
    # quay.io/invidious/youtube-trusted-session-generator, which the earlier
    # version of this comment recommended: it no longer works, and fails with
    # "[potoken] failed to extract token" on every run.
    #
    # A token lasts about six hours and is bound to the egress IP that minted
    # it, so it goes stale on a timer and again on any move between networks.
    # Empty values mean "no token", which is a supported state — playback works
    # without one whenever YouTube is not currently flagging this host.
    pot:
      token: '${YT_PO_TOKEN:}'
      visitorData: '${YT_VISITOR_DATA:}'
    # Some videos — label-owned music in particular — are refused the same way
    # on every anonymous client no matter how many are configured, and no
    # poToken changes that: YouTube wants a signed-in session, and OAuth is how
    # youtube-source provides one. This is the only remedy that reaches the TV
    # client, and the TV client is the only one that plays sign-in-gated videos.
    #
    # Off by default because it means attaching a Google account — use a burner,
    # never a primary; upstream warns the account can be terminated. Turn it on
    # with YT_OAUTH_ENABLED=true, watch the Lavalink log for the device code,
    # authorise it at google.com/device, then put the refresh token it prints
    # into YT_OAUTH_REFRESH_TOKEN so restarts skip the flow.
    oauth:
      enabled: ${YT_OAUTH_ENABLED:false}
      # Left unset rather than empty: an empty string is a value, and a blank
      # token is not the same as "no token" to the plugin.
      # refreshToken: '${YT_OAUTH_REFRESH_TOKEN:}'

  lavasrc:
    # Only reached when LavaSrc itself resolves something — an Apple Music link,
    # or the rarely-used Spotify fallback. The bot's own resolver (see
    # docs/MUSIC_SYSTEM.md) does not come through here: it searches the playback
    # providers directly so it can filter and score candidates, which LavaSrc
    # cannot do. The order still mirrors the same policy so the two paths do not
    # disagree about where audio should come from — ISRC first because it names
    # the recording outright, then SoundCloud, then YouTube.
    providers:
      - 'scsearch:%ISRC%'
      - 'ytsearch:"%ISRC%"'
      - 'scsearch:%QUERY%'
      - 'ytsearch:%QUERY%'
    sources:
      # Metadata only: these resolve an identity and then stream through
      # SoundCloud/YouTube per the provider list above. Deezer stays off here
      # because streaming from it needs a master decryption key this deployment
      # does not have — the bot reaches Deezer for *metadata* through its public
      # HTTP API instead (music/metadata-providers.ts), which needs no key and
      # is the only one of the three catalogues that exposes ISRCs.
      spotify: true
      applemusic: true
      deezer: false
      yandexmusic: false
    spotify:
      clientId: '${SPOTIFY_CLIENT_ID}'
      clientSecret: '${SPOTIFY_CLIENT_SECRET}'
      countryCode: 'IN'
      playlistLoadLimit: 6
      albumLoadLimit: 6
    deezer:
      masterDecryptionKey: ''

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ''

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    # Prints the device code and, after authorisation, the refresh token. The
    # OAuth flow is unusable without it (upstream's own note).
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 7
