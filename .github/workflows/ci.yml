name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Cancel superseded runs on the same branch; the newest commit is what matters.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder configuration. Lint, typecheck and unit tests never open a
  # connection — real credentials belong in repository secrets, and integration
  # tests get service containers in a later phase.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/discord_music
  REDIS_URL: redis://localhost:6379

jobs:
  verify:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Validate Prisma schema
        run: pnpm --filter @discord-music/database run validate
