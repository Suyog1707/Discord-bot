# Local PostgreSQL and Redis are started alongside the bot infrastructure.
# Bot containers keep using the URLs in .env until data migration is verified;
# switching every bot to the Docker-internal URLs is a separate checkpoint.
#
#   pnpm run docker:up     # start
#   pnpm run docker:logs   # follow logs
#   pnpm run docker:down   # stop
#
# Those scripts pin DOCKER_CONTEXT=default. A machine running Docker Desktop
# alongside the system daemon has two independent daemons, and Desktop makes
# itself the active context every time it starts — so a bare `docker compose up`
# would build a *second* copy of this stack on the other daemon and fail on the
# published ports, which are already held by the first. Export DOCKER_CONTEXT
# yourself to override the pin.
#
# The bots also run here, in production mode, built from apps/bot/Dockerfile —
# one container per Discord application, because Discord allows a single voice
# connection per guild per token and each simultaneous room needs its own.
#
# For fast hot-reload development, stop them (`docker compose stop bot-main
# bot-player-2 ...`, or just `bot-main`) and run `pnpm dev` on the host instead:
# that runs one identity in-process, which is the whole bot minus the extra
# rooms, and talks to this same Lavalink. The web app runs on the host / Vercel
# per docs/DEPLOYMENT.md.

name: discord-music

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discord_music}
      POSTGRES_USER: ${POSTGRES_USER:-discord_music}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data-2026:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-migrate:
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
      target: migration
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discord_music}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-discord_music}
      DIRECT_URL: postgresql://${POSTGRES_USER:-discord_music}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-discord_music}
    command: ['pnpm', '--filter', '@discord-music/database', 'run', 'deploy']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      [
        'sh',
        '-c',
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data-2026:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web-backend:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-discord_music}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-discord_music}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health',{redirect:'manual'}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Funnel points only at this loopback port. Even a direct Funnel visitor
  # needs the secret that Vercel injects; the raw Next.js port is unpublished.
  web-gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web-backend:
        condition: service_healthy
    environment:
      ORIGIN_SECRET: ${ORIGIN_SECRET:?Set ORIGIN_SECRET in .env}
    ports:
      - '127.0.0.1:20900:8080'
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro

  # The Lavalink image ships no /opt/Lavalink/plugins directory, so Docker
  # creates the named volume's mountpoint owned by root while the server runs as
  # uid 322. Plugin downloads then fail with "Permission denied" and the server
  # never starts. Claim the volume before the server boots; this also repairs a
  # volume left root-owned by an earlier run.
  lavalink-init:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: dmp-lavalink-init
    user: root
    entrypoint:
      [
        'sh',
        '-c',
        'mkdir -p /opt/Lavalink/plugins && chown -R 322:322 /opt/Lavalink/plugins',
      ]
    volumes:
      - lavalink-plugins:/opt/Lavalink/plugins
    restart: 'no'

  # Signature deciphering for the YouTube source (application.yml:
  # plugins.youtube.remoteCipher). YouTube's player script outgrew the
  # extractor built into youtube-source — every track failed with "Must find sig
  # function from script" — and upstream's answer is to hand deciphering to this
  # service instead of shipping a new regex per player release. The container
  # name is load-bearing: Lavalink reaches it as http://yt-cipher:8001. No
  # published port, because only Lavalink should be able to talk to it.
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: dmp-yt-cipher
    restart: unless-stopped
    environment:
      # Upstream: only the IAS script variants currently work reliably.
      OVERRIDE_PLAYER_VARIANT: IAS
    networks:
      default:
        aliases:
          - yt-cipher

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: dmp-lavalink
    restart: unless-stopped
    depends_on:
      lavalink-init:
        condition: service_completed_successfully
      # Distroless image with no shell, so there is no healthcheck to wait on.
      # Lavalink only calls the cipher server when a track is played, which is
      # long after both have settled.
      yt-cipher:
        condition: service_started
    environment:
      _JAVA_OPTIONS: -Xmx1G
      SERVER_PORT: 2333
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      # application.yml interpolates these into the LavaSrc Spotify block. They
      # were never passed through, so LavaSrc authenticated with empty strings
      # and Spotify links handed straight to Lavalink failed with
      # "invalid_client" surfacing as "Something went wrong while looking up the
      # track". The bot resolves Spotify itself and rarely hits this path, but a
      # source configured with credentials it cannot see is a trap.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      # YouTube proof-of-origin token (application.yml: plugins.youtube.pot).
      # Without it YouTube treats this host as a bot and refuses playback on
      # every client at once. Both values are bound to the egress IP that
      # generated them — see the application.yml comment for how to make a pair.
      YT_PO_TOKEN: ${YT_PO_TOKEN:-}
      YT_VISITOR_DATA: ${YT_VISITOR_DATA:-}
      # YouTube OAuth (application.yml: plugins.youtube.oauth) — the only way to
      # play sign-in-gated videos. Off unless YT_OAUTH_ENABLED is set.
      YT_OAUTH_ENABLED: ${YT_OAUTH_ENABLED:-false}
      YT_OAUTH_REFRESH_TOKEN: ${YT_OAUTH_REFRESH_TOKEN:-}
    ports:
      - '127.0.0.1:${LAVALINK_PORT:-2333}:2333'
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-plugins:/opt/Lavalink/plugins
    healthcheck:
      # The image ships curl but no nc, so the obvious `nc -z` check fails
      # forever and reports a healthy server as unhealthy. 127.0.0.1 rather than
      # localhost: the container resolves that to ::1 first, where Lavalink does
      # not listen. `$$` passes the variable through to the container's shell
      # instead of being interpolated by Compose.
      test:
        [
          'CMD-SHELL',
          'curl -fsS -o /dev/null -H "Authorization: $$LAVALINK_SERVER_PASSWORD" http://127.0.0.1:2333/version',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Cold starts download plugins before the port opens.
      start_period: 90s

  # The bot, in production mode. Built from the repo root so the workspace
  # lockfile is in the build context (see apps/bot/Dockerfile).
  # ---------------------------------------------------------------- the bots
  #
  # One container per Discord application. Discord allows one voice connection
  # per guild per token, so a server playing in several channels at once needs
  # one application per room — and a container each, so a crash takes down one
  # room rather than all of them.
  #
  # They are written out rather than generated: seven near-identical blocks is
  # repetitive, but you can read this file and see exactly what runs, and change
  # one player without touching the others.
  #
  # `bot-main` is the primary: it owns the slash commands, the guards and the
  # dashboard command bus, and plays as well — so a server that only ever needs
  # one room still invites one bot. The rest are headless players.
  #
  # Adding an eighth is a copy of a player block plus its two tokens in .env.
  # Nothing in the code knows how many there are; each registers itself on
  # startup.
  #
  # HOW MANY ACTUALLY RUN is decided in .env, not here. Each player sits behind
  # a compose profile, so `bot-main` alone starts by default — the single-room
  # setup that has always worked — and players are switched on with
  # COMPOSE_PROFILES:
  #
  #   COMPOSE_PROFILES=players            # every player below
  #   COMPOSE_PROFILES=player-2,player-3  # just those two
  #
  # A player with no profile active is never started, so an identity you have
  # not created yet cannot sit in a restart loop complaining about a missing
  # token.

  bot-main:
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    container_name: dmp-bot-main
    # `always`, not `unless-stopped`: the pool is meant to be up, including
    # after the host reboots.
    restart: always
    depends_on:
      lavalink:
        condition: service_healthy
    # Real configuration (DATABASE_URL, REDIS_URL, …) comes from the repo-root
    # .env; the entries below override it where the container's view of the
    # world differs from the host's, and give this container its identity.
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      # Inside the compose network Lavalink is reached by service name on its
      # internal port — not the localhost:${LAVALINK_PORT} that .env points at
      # for host-side `pnpm dev`.
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: 2333
      LAVALINK_SECURE: 'false'
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      BOT_INTERNAL_PORT: ${BOT_INTERNAL_PORT:-8080}
      BOT_ROLE: primary
      BOT_LABEL: main
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_CLIENT_ID: ${BOT_CLIENT_ID}
    # Probed with node rather than curl: the image is node:22-alpine, which
    # ships neither curl nor a wget with predictable flags, and node is
    # guaranteed present because it is what runs the bot. Unhealthy means the
    # gateway is gone — see `resolveBotHealth` for why that is the only thing
    # reported as unhealthy.
    healthcheck: &bot-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.BOT_INTERNAL_PORT||8080)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  bot-player-2:
    profiles: ['players', 'player-2']
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    container_name: dmp-bot-player-2
    restart: always
    depends_on:
      lavalink:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: 2333
      LAVALINK_SECURE: 'false'
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      BOT_INTERNAL_PORT: ${BOT_INTERNAL_PORT:-8080}
      BOT_ROLE: player
      BOT_LABEL: player-2
      BOT_TOKEN: ${BOT_PLAYER_2_TOKEN:-}
      BOT_CLIENT_ID: ${BOT_PLAYER_2_CLIENT_ID:-}
    healthcheck: *bot-healthcheck

  bot-player-3:
    profiles: ['players', 'player-3']
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    container_name: dmp-bot-player-3
    restart: always
    depends_on:
      lavalink:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: 2333
      LAVALINK_SECURE: 'false'
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      BOT_INTERNAL_PORT: ${BOT_INTERNAL_PORT:-8080}
      BOT_ROLE: player
      BOT_LABEL: player-3
      BOT_TOKEN: ${BOT_PLAYER_3_TOKEN:-}
      BOT_CLIENT_ID: ${BOT_PLAYER_3_CLIENT_ID:-}
    healthcheck: *bot-healthcheck

  bot-player-4:
    profiles: ['players', 'player-4']
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    container_name: dmp-bot-player-4
    restart: always
    depends_on:
      lavalink:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: 2333
      LAVALINK_SECURE: 'false'
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      BOT_INTERNAL_PORT: ${BOT_INTERNAL_PORT:-8080}
      BOT_ROLE: player
      BOT_LABEL: player-4
      BOT_TOKEN: ${BOT_PLAYER_4_TOKEN:-}
      BOT_CLIENT_ID: ${BOT_PLAYER_4_CLIENT_ID:-}
    healthcheck: *bot-healthcheck

  bot-player-5:
    profiles: ['players', 'player-5']
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    container_name: dmp-bot-player-5
    restart: always
    depends_on:
      lavalink:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: 2333
      LAVALINK_SECURE: 'false'
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      BOT_INTERNAL_PORT: ${BOT_INTERNAL_PORT:-8080}
      BOT_ROLE: player
      BOT_LABEL: player-5
      BOT_TOKEN: ${BOT_PLAYER_5_TOKEN:-}
      BOT_CLIENT_ID: ${BOT_PLAYER_5_CLIENT_ID:-}
    healthcheck: *bot-healthcheck

  bot-player-6:
    profiles: ['players', 'player-6']
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    container_name: dmp-bot-player-6
    restart: always
    depends_on:
      lavalink:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: 2333
      LAVALINK_SECURE: 'false'
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      BOT_INTERNAL_PORT: ${BOT_INTERNAL_PORT:-8080}
      BOT_ROLE: player
      BOT_LABEL: player-6
      BOT_TOKEN: ${BOT_PLAYER_6_TOKEN:-}
      BOT_CLIENT_ID: ${BOT_PLAYER_6_CLIENT_ID:-}
    healthcheck: *bot-healthcheck

  bot-player-7:
    profiles: ['players', 'player-7']
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    container_name: dmp-bot-player-7
    restart: always
    depends_on:
      lavalink:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: 2333
      LAVALINK_SECURE: 'false'
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      BOT_INTERNAL_PORT: ${BOT_INTERNAL_PORT:-8080}
      BOT_ROLE: player
      BOT_LABEL: player-7
      BOT_TOKEN: ${BOT_PLAYER_7_TOKEN:-}
      BOT_CLIENT_ID: ${BOT_PLAYER_7_CLIENT_ID:-}
    healthcheck: *bot-healthcheck

volumes:
  lavalink-plugins:
  postgres-data-2026:
  redis-data-2026:
