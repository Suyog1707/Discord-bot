# Local development infrastructure: Lavalink and its cipher sidecar.
#
# PostgreSQL and Redis are not here: this project uses Supabase and Upstash, so
# DATABASE_URL and REDIS_URL point at those and a local copy would only be a
# second, divergent database to keep straight. Audio is the one dependency that
# still has to run locally.
#
#   pnpm run docker:up     # start
#   pnpm run docker:logs   # follow logs
#   pnpm run docker:down   # stop
#
# Those scripts pin DOCKER_CONTEXT=default. A machine running Docker Desktop
# alongside the system daemon has two independent daemons, and Desktop makes
# itself the active context every time it starts — so a bare `docker compose up`
# would build a *second* copy of this stack on the other daemon and fail on the
# published ports, which are already held by the first. Export DOCKER_CONTEXT
# yourself to override the pin.
#
# The apps themselves run on the host via `pnpm dev` so hot-reload stays fast.
# Production deployment is Vercel (web) + VPS (bot/Lavalink) per docs/DEPLOYMENT.md.

name: discord-music

services:
  # The Lavalink image ships no /opt/Lavalink/plugins directory, so Docker
  # creates the named volume's mountpoint owned by root while the server runs as
  # uid 322. Plugin downloads then fail with "Permission denied" and the server
  # never starts. Claim the volume before the server boots; this also repairs a
  # volume left root-owned by an earlier run.
  lavalink-init:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: dmp-lavalink-init
    user: root
    entrypoint:
      [
        'sh',
        '-c',
        'mkdir -p /opt/Lavalink/plugins && chown -R 322:322 /opt/Lavalink/plugins',
      ]
    volumes:
      - lavalink-plugins:/opt/Lavalink/plugins
    restart: 'no'

  # Signature deciphering for the YouTube source (application.yml:
  # plugins.youtube.remoteCipher). YouTube's player script outgrew the
  # extractor built into youtube-source — every track failed with "Must find sig
  # function from script" — and upstream's answer is to hand deciphering to this
  # service instead of shipping a new regex per player release. The container
  # name is load-bearing: Lavalink reaches it as http://yt-cipher:8001. No
  # published port, because only Lavalink should be able to talk to it.
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: dmp-yt-cipher
    restart: unless-stopped
    environment:
      # Upstream: only the IAS script variants currently work reliably.
      OVERRIDE_PLAYER_VARIANT: IAS
    networks:
      default:
        aliases:
          - yt-cipher

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: dmp-lavalink
    restart: unless-stopped
    depends_on:
      lavalink-init:
        condition: service_completed_successfully
      # Distroless image with no shell, so there is no healthcheck to wait on.
      # Lavalink only calls the cipher server when a track is played, which is
      # long after both have settled.
      yt-cipher:
        condition: service_started
    environment:
      _JAVA_OPTIONS: -Xmx1G
      SERVER_PORT: 2333
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      # application.yml interpolates these into the LavaSrc Spotify block. They
      # were never passed through, so LavaSrc authenticated with empty strings
      # and Spotify links handed straight to Lavalink failed with
      # "invalid_client" surfacing as "Something went wrong while looking up the
      # track". The bot resolves Spotify itself and rarely hits this path, but a
      # source configured with credentials it cannot see is a trap.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      # YouTube OAuth (application.yml: plugins.youtube.oauth) — the only way to
      # play sign-in-gated videos. Off unless YT_OAUTH_ENABLED is set.
      YT_OAUTH_ENABLED: ${YT_OAUTH_ENABLED:-false}
      YT_OAUTH_REFRESH_TOKEN: ${YT_OAUTH_REFRESH_TOKEN:-}
    ports:
      - '${LAVALINK_PORT:-2333}:2333'
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-plugins:/opt/Lavalink/plugins
    healthcheck:
      # The image ships curl but no nc, so the obvious `nc -z` check fails
      # forever and reports a healthy server as unhealthy. 127.0.0.1 rather than
      # localhost: the container resolves that to ::1 first, where Lavalink does
      # not listen. `$$` passes the variable through to the container's shell
      # instead of being interpolated by Compose.
      test:
        [
          'CMD-SHELL',
          'curl -fsS -o /dev/null -H "Authorization: $$LAVALINK_SERVER_PASSWORD" http://127.0.0.1:2333/version',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Cold starts download plugins before the port opens.
      start_period: 90s

volumes:
  lavalink-plugins:
